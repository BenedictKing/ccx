name: ccx-agents CI

on:
  push:
    branches: [main, master]
    paths:
      - "packages/ccx-agents/**"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/ccx-agents/**"

defaults:
  run:
    working-directory: packages/ccx-agents

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/

      - name: Type check
        run: |
          pip install -e ".[ci]"
          pyright src/ccx_agents/

      - name: Test with coverage
        run: |
          python -m pytest tests/ -v --tb=short -q --cov=src/ccx_agents --cov-report=term-missing

      - name: Verify import
        run: |
          python -c "from ccx_agents import CcxConfig, CcxRouter, CcxConversation, CcxTracing, CcxConfigProtocol; print('ccx-agents', __import__('ccx_agents').__version__, 'OK')"
